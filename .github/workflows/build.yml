name: Build StayAwake.dylib

on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build iOS arm64 dynamic library
        run: |
          sdk_path="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang \
            -arch arm64 -isysroot "$sdk_path" -miphoneos-version-min=15.0 \
            -fobjc-arc -dynamiclib -framework UIKit -framework Foundation -framework CoreGraphics \
            -install_name @rpath/StayAwake.dylib \
            StayAwake.m -o StayAwake.dylib
          file StayAwake.dylib
          xcrun vtool -show-build StayAwake.dylib

      - name: Ad-hoc sign and verify the dynamic library
        run: |
          codesign --force --sign - StayAwake.dylib
          codesign --verify --strict --verbose=2 StayAwake.dylib
          codesign --display --verbose=4 StayAwake.dylib

      - uses: actions/upload-artifact@v6
        with:
          name: StayAwake-iOS-arm64
          path: StayAwake.dylib
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: StayAwake-iOS-arm64

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" StayAwake.dylib \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "StayAwake $GITHUB_REF_NAME" \
            --notes 'Ad-hoc signed iOS 15.0+ arm64 dynamic library for LiveContainer. Remove the previously imported copy before importing this release.'
